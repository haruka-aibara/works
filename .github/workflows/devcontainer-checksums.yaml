# Renovate が devcontainer の Dockerfile の CLAUDE_VERSION を上げたとき、
# 対応する SHA256 を計算し直して同じブランチに push する。
# Renovate は SHA256 を計算できないため、この後追いが要る。
name: Update Dev Container Checksums

on:
  push:
    branches:
      - 'renovate/**'
    paths:
      - 'devcontainer-templates/src/haruka-aibara-dev-env/.devcontainer/Dockerfile'

permissions: {}

# 実行中に Renovate がブランチを更新したら、古い実行は push が通らないので捨てる。
concurrency:
  group: devcontainer-checksums-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # 追いコミットの push
      contents: write
      # 追いコミットに対する必須チェックの起動（workflow_dispatch）
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - run: devcontainer-templates/scripts/update-checksums.sh

      # 追いコミットを push するので、認証情報を残す（persist-credentials: false にしない）。
      # このコミットの author は renovate.json の gitIgnoredAuthors に入れてあるので、
      # Renovate は引き続きこのブランチを rebase・更新する。
      - name: Commit and push
        id: push
        run: |
          if git diff --quiet; then
            echo "checksums are up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'fix(devcontainer): SHA256 をバージョンに合わせて更新'
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN の push では pull_request の実行が承認待ちで止まり、追いコミットに必須チェックが付かない。
      # workflow_dispatch は GITHUB_TOKEN からでも起動できるので、必須チェックを出すワークフローをここで起動する。
      # Terraform Cloud の speculative plan は webhook で動くので、ここで起動しなくても走る。
      - name: Run required checks on the new commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          gh workflow run lint.yml --ref "$BRANCH"
          gh workflow run terraform-ci.yml --ref "$BRANCH"
