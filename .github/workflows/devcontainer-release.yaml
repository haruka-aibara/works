# devcontainer テンプレートを ghcr.io に publish する（devcontainers/template-starter と同じ形）。
#
# publish するバージョンは devcontainer-template.json の version で、PR の中で手で上げる。
# 上げていなければ publish 済みのバージョンなので、何もせずに終わる。
name: Release Dev Container Templates

on:
  push:
    branches: [main]
    paths:
      - 'devcontainer-templates/src/**'
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: テンプレートを ghcr に publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-templates: "true"
          base-path-to-templates: "./devcontainer-templates/src"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
