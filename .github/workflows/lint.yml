# YAML / GitHub Actions / Markdown の構文チェックと、ワークフローのセキュリティ検査。
# Terraform 管理外（workflow-dist/ から配布される terraform-ci.yml / python-ci.yml とは別物）なので
# このファイルは直接編集してよい。
# 導入の経緯とルールの取捨は docs/decisions/0002-lint-ci-for-docs-and-config.md。
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: git ls-files -z '*.yml' '*.yaml' | xargs -0 uvx yamllint --strict -f github

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # run: 内のシェルもイメージ同梱の shellcheck で検査される。
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # 設定は .github/zizmor.yml。配布する reusable workflow も .github/workflows/reusable-*.yml にある。
      - run: uvx zizmor@1.30.1 --offline --format github .github/workflows


  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 設定と対象外のファイルは .markdownlint-cli2.jsonc。
      # 手元では `npx markdownlint-cli2 --fix "**/*.md"` で空行まわりを自動修正できる。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npx --yes markdownlint-cli2@0.23 "**/*.md"
