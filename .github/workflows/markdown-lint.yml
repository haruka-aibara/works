# Markdown の書式チェック。設定と対象外のファイルは .markdownlint-cli2.jsonc。
# 手元では `npx markdownlint-cli2 --fix "**/*.md"` で空行まわりを自動修正できる。
# 導入の経緯は docs/decisions/0002-lint-ci-for-docs-and-config.md。
name: Markdown Lint

on:
  pull_request:
  push:
    branches: [main]
  # devcontainer-checksums.yaml の追いコミットに対して起動する。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdownlint:
    name: Markdown の書式チェック (markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
