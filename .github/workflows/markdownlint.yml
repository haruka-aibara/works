# 設定と対象外のファイルは .markdownlint-cli2.jsonc。
# 手元では `npx markdownlint-cli2 --fix "**/*.md"` で空行まわりを自動修正できる。
# 導入の経緯は docs/decisions/0002-lint-ci-for-docs-and-config.md。
name: markdownlint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Markdown の書式チェック
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: "**/*.md"
