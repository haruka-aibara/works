# Managed by Terraform (haruka-aibara/works). Do not edit directly.
name: Python CI

# Start only when Python may have changed. Which projects to test is decided inside
# the reusable workflow. Note: a check filtered out by paths never reports, so it
# cannot be made a required status check without dropping these filters.
on:
  pull_request:
    paths: &python-paths
      - "**/*.py"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/reusable-python-ci.yml"
  push:
    branches: [main]
    paths: *python-paths

permissions:
  contents: read

# Cancel superseded runs on a pull request; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Python
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      working-directory: "."
