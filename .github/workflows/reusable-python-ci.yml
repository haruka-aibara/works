name: Python CI

# Every directory under `working-directory` with a tracked pyproject.toml is a Python
# project and gets its own ruff + pytest job. Each project carries its own uv.lock
# and tests/. Adding a project is just adding the directory.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory searched for Python projects (directories holding a pyproject.toml)
        type: string
        default: "."

permissions:
  contents: read

env:
  # renovate: datasource=pypi depName=ruff
  RUFF_VERSION: 0.16.10

jobs:
  discover:
    name: 対象プロジェクトの検出
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tracked files only, so local virtualenvs never count as projects.
      - id: find
        env:
          SEARCH_ROOT: ${{ inputs.working-directory }}
        run: |
          projects=$(git ls-files -- "$SEARCH_ROOT" | grep -E '(^|/)pyproject\.toml$' | xargs -r -n1 dirname | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    name: lint・テスト (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - run: uvx "ruff@${RUFF_VERSION}" check .
      # --locked fails if uv.lock is stale instead of silently re-resolving it.
      - run: uv sync --locked
      - run: uv run pytest
