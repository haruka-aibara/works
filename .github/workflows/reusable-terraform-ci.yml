name: Terraform CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory that contains the Terraform code
        type: string
        default: "."
      terraform-version:
        description: Terraform version to use (empty = read .terraform-version, else latest)
        type: string
        default: ""

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve Terraform version
        id: tfver
        env:
          TF_VERSION_INPUT: ${{ inputs.terraform-version }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          if [ -n "$TF_VERSION_INPUT" ]; then
            echo "version=$TF_VERSION_INPUT" >> "$GITHUB_OUTPUT"
          elif [ -f "$WORKING_DIRECTORY/.terraform-version" ]; then
            echo "version=$(cat "$WORKING_DIRECTORY/.terraform-version")" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
      - name: terraform fmt -check
        working-directory: ${{ inputs.working-directory }}
        run: terraform fmt -check -recursive

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
      - name: tflint --init
        working-directory: ${{ inputs.working-directory }}
        run: tflint --init
      - name: tflint
        working-directory: ${{ inputs.working-directory }}
        run: tflint -f compact

  trivy:
    name: trivy (IaC misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.working-directory }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
