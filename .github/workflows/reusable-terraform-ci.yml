name: Terraform CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory that contains the Terraform code
        type: string
        default: "."

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=terraform-linters/tflint
  TFLINT_VERSION: v0.64.0

jobs:
  terraform:
    name: フォーマット・構文チェック (terraform fmt / validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Use the version in .terraform-version, or the latest one if there is none.
      - id: version
        run: echo "terraform=$(cat .terraform-version 2>/dev/null || echo latest)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
      - run: terraform fmt -check -recursive
      # -backend=false: no backend or HCP Terraform credentials needed.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  tflint:
    name: 書き方・AWS 設定値のチェック (tflint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      # Plugins (pinned in .tflint.hcl) come from GitHub Releases; the token avoids the anonymous rate limit.
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint -f compact

  trivy:
    name: セキュリティ設定の検査 (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.working-directory }}
          exit-code: "1"
          severity: HIGH,CRITICAL
