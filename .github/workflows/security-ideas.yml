# security-ideas スキルの deep-dive の手順で刺さる 1 本を出し、Slack に送る。
# Claude は Bedrock で動かし、結果は SNS トピック → AWS Chatbot で Slack に届く。
# AWS 側（ロール・トピック・Chatbot）は modules/security-ideas-slack-notifier。
# 認証は GitHub の OIDC だけで、API キーも Slack の秘密もリポジトリに置かない。
name: Security ideas

on:
  schedule:
    # 平日 7:53 JST。GitHub の schedule は毎時 0 分が混んで遅れやすいので、ずらしている。
    - cron: "53 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ideas
  cancel-in-progress: false

env:
  # modules/security-ideas-slack-notifier の outputs と同じ値。名前を変えたらここも直す。
  AWS_ROLE_ARN: arn:aws:iam::172580074565:role/security-ideas-github-actions-role
  SNS_TOPIC_ARN: arn:aws:sns:ap-northeast-1:172580074565:security-ideas_topic
  BEDROCK_MODEL: anthropic.claude-opus-5-5
  # 自動実行で出したアイデアの履歴。ideas/ には書かないので、重複よけはこれで持つ。
  HISTORY_FILE: .security-ideas-history/history.md

jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # AWS への OIDC 認証に使う。
      id-token: write
    env:
      # Claude Code が軽い処理に使う Haiku も同じモデルに寄せ、IAM で許すモデルを 1 つにする。
      ANTHROPIC_DEFAULT_HAIKU_MODEL: anthropic.claude-opus-5-5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 前回までの履歴を取り出す。キーは毎回変わるので、restore-keys で最新のものに当たる。
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .security-ideas-history
          key: security-ideas-history-${{ github.run_id }}
          restore-keys: security-ideas-history-

      - run: |
          mkdir -p "$(dirname "$HISTORY_FILE")"
          touch "$HISTORY_FILE"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - id: claude
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          use_bedrock: "true"
          github_token: ${{ github.token }}
          prompt: |
            .claude/skills/security-ideas/SKILL.md と .claude/skills/security-ideas/references/deep-dive.md を読み、deep-dive.md の手順で刺さる 1 本を出してください。
            SKILL.md が読むよう指示しているファイル（rejected.md・手本の 4 本・ideas/ と til/ のファイル名）は必ず読んでください。

            これは毎朝の自動実行で、結果は Slack に送られます。いつもと違う点は次のとおりです。

            - ${{ env.HISTORY_FILE }} は、過去の自動実行で出したアイデアの一覧です。ここにあるネタも、同じ切り口の言い換えも出さないでください
            - ユーザーに聞き返せないので、分野は自分で選んでください
            - Web 検索は使えません。裏取りは、公式ドキュメントの URL を WebFetch で読んで行ってください
            - ファイルは書き換えず、ideas/ や til/ にも書かないでください
            - 結果は指定の JSON の形で返してください
          claude_args: |
            --model ${{ env.BEDROCK_MODEL }}
            --effort xhigh
            --max-turns 200
            --allowedTools Read,Glob,Grep,WebFetch,Task
            --json-schema '{"type":"object","additionalProperties":false,"required":["kind","title","what_happens","how_to_fix","why_overlooked","sources","unverified","runners_up"],"properties":{"kind":{"type":"string","description":"種類（組み合わせ（IaC × 時間）、攻撃の手口など）"},"title":{"type":"string","description":"アイデアを一文で"},"what_happens":{"type":"string","description":"どのサービスの・どの設定で・何が起きるか"},"how_to_fix":{"type":"string","description":"どう直すか / どう気づくか"},"why_overlooked":{"type":"string","description":"なぜ見落とされるか"},"sources":{"type":"array","items":{"type":"string"},"description":"裏取りに使った URL"},"unverified":{"type":"array","items":{"type":"string"},"description":"確かめきれなかったこと。なければ空配列"},"runners_up":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["idea","reason"],"properties":{"idea":{"type":"string"},"reason":{"type":"string","description":"落とした理由を一言"}}},"description":"惜しかった候補 2〜3 本"}}}'

      - name: Publish to Slack
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$STRUCTURED_OUTPUT" ]; then
            echo "::error::Claude から structured_output が返ってこなかった"
            exit 1
          fi
          today=$(TZ=Asia/Tokyo date +%F)

          # AWS Chatbot のカスタム通知の形式。description は Slack の mrkdwn で表示される。
          message=$(jq -c --arg today "$today" --arg run "$RUN_URL" '
            def bullets: [.[] | "• \(.)"] | join("\n");
            {
              version: "1.0",
              source: "custom",
              content: {
                textType: "client-markdown",
                title: "セキュリティのアイデア \($today)：\(.title)",
                description: (
                  "_\(.kind)_\n\n"
                  + "*何が起きるか*\n\(.what_happens)\n\n"
                  + "*どう直すか / どう気づくか*\n\(.how_to_fix)\n\n"
                  + "*なぜ見落とされるか*\n\(.why_overlooked)"
                  + (if (.unverified | length) > 0 then "\n\n*確かめていないこと*\n" + (.unverified | bullets) else "" end)
                  + (if (.sources | length) > 0 then "\n\n*裏取り*\n" + (.sources | bullets) else "" end)
                  + (if (.runners_up | length) > 0
                     then "\n\n*惜しかった候補*\n" + ([.runners_up[] | "• \(.idea)（\(.reason)）"] | join("\n"))
                     else "" end)
                  + "\n\n実行ログ: \($run)"
                )
              }
            }' <<<"$STRUCTURED_OUTPUT")

          aws sns publish --topic-arn "$SNS_TOPIC_ARN" --message "$message" > /dev/null

          # 次回以降の重複よけに足す。古いものから捨て、直近 200 本だけ残す。
          jq -r --arg today "$today" '"- \($today) \(.kind)：\(.title)", (.runners_up[] | "- \($today) 惜しかった候補：\(.idea)")' \
            <<<"$STRUCTURED_OUTPUT" >> "$HISTORY_FILE"
          tail -n 200 "$HISTORY_FILE" > "$HISTORY_FILE.tmp" && mv "$HISTORY_FILE.tmp" "$HISTORY_FILE"

      # 黙って届かない日が続くと気づけないので、失敗も Slack に送る。
      - name: Notify failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          message=$(jq -nc --arg run "$RUN_URL" '
            {version: "1.0", source: "custom",
             content: {textType: "client-markdown",
                       title: "セキュリティのアイデア：実行に失敗しました",
                       description: "実行ログ: \($run)"}}')
          aws sns publish --topic-arn "$SNS_TOPIC_ARN" --message "$message" > /dev/null

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .security-ideas-history
          key: security-ideas-history-${{ github.run_id }}
