# Managed by Terraform (haruka-aibara/works). Do not edit directly.
name: Terraform CI

on:
  pull_request:
  push:
    branches: [main]
  # For commits pushed with GITHUB_TOKEN (see devcontainer-checksums.yaml).
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on a pull request; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Terraform
    uses: ./.github/workflows/reusable-terraform-ci.yml
    with:
      working-directory: "."
