# 設定は .github/zizmor.yml。導入の経緯は docs/decisions/0002-lint-ci-for-docs-and-config.md。
name: zizmor

on:
  pull_request:
  push:
    branches: [main]
  # devcontainer-checksums.yaml の追いコミットに対して起動する。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.30.1

jobs:
  check:
    name: GitHub Actions ワークフローのセキュリティ検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uvx "zizmor@${ZIZMOR_VERSION}" --offline --format github .github/workflows
