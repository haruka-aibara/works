# trivy（Terraform ワークフローの IaC misconfig 検査）で、ファイル単位で見送るもの。
# trivy.yaml から ignorefile として読む。
misconfigurations:
  - id: DS-0002
    paths:
      - hands-on/github-actions-test-custom-actions/.github/actions/deploy-s3-docker/Dockerfile
    statement: Docker コンテナアクションは root で動かす前提（GitHub の仕様で USER を置けない）
  - id: AWS-0104
    paths:
      - modules/waydroid-ec2/main.tf
    statement: Waydroid のイメージ取得・Google Play・アプリの通信先が広く固定できないので egress は全開。インバウンドは全閉
