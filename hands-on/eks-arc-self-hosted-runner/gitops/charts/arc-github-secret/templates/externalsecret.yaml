# Secrets Manager 側は github_app_id / github_app_installation_id / github_app_private_key の
# 3 つのキーを持つ JSON にしておく。ARC はこのキー名で読む。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: arc-github-app
  dataFrom:
    - extract:
        key: {{ .Values.appSecretName }}
