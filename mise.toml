# このリポジトリの作業で使うツール。このリポジトリでコマンドを打つと、入っていなければここの版が入る。
# https://mise.jdx.dev/configuration.html
# 版は範囲や latest にせず、正確に固定する。Renovate が mise.toml と mise.lock を書き換える PR を出す。
# https://docs.renovatebot.com/modules/manager/mise/
# docker・bubblewrap・socat は mise で入れない。理由と入れ方は docs/runbooks/wsl-mise-claude-sandbox.md。
[tools]
# terraform の版は .terraform-version（CI と HCP Terraform が読む）とそろえる。Renovate が両方を同じ PR で上げる。
terraform = "1.17.1"
tflint = "0.66.0"
aws-cli = "2.41.2"
gh = "2.105.0"
kubectl = "1.37.2"
helm = "4.3.2"
minikube = "1.39.0"
node = "26.13.1"
python = "3.15.2"
uv = "0.13.9"
jq = "1.8.2"
# gcloud は mise では vfox プラグインしかない（配布元のチェックサム・署名の確認はない）
# https://github.com/mise-plugins/vfox-gcloud
gcloud = "594.0.0"
# Claude Code は公式の npm 版で入れる。自動更新は .claude/settings.json の DISABLE_UPDATES で止め、版は Renovate で上げる
# https://code.claude.com/docs/en/setup
# mise は npm パッケージのスクリプトを既定で実行しないが、Claude Code は postinstall で本体のバイナリをつなぐので、Claude Code 自身のスクリプトだけ許可する
# 本体は版が固定された別パッケージ（@anthropic-ai/claude-code-linux-x64 など）から入る
# https://mise.jdx.dev/dev-tools/backends/npm.html
"npm:@anthropic-ai/claude-code" = { version = "2.1.323", allow_builds = ["@anthropic-ai/claude-code"] }
# Python 製のツールは pypi バックエンドで入れる（uv で入れる）
# https://mise.jdx.dev/dev-tools/backends/pypi.html
"pypi:flake8" = "7.5.0"
"pypi:pylint" = "4.1.4"
"pypi:pyre-check" = "0.10.0"
"pypi:pytest" = "9.2.0"
"pypi:ansible-core" = "2.22.0"
"pypi:ansible-lint" = "26.11.0"
